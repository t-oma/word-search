name: Deploy to GitHub Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build docs
        run: pnpm docs:build

      - name: Copy docs to build
        run: |
          mkdir -p build/client/docs
          cp -r docs/.vitepress/dist/* build/client/docs/

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Copy Storybook to build
        run: |
          mkdir -p build/client/storybook
          cp -r storybook-static/* build/client/storybook/

      - name: Upload pages artifact
        id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/client/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
